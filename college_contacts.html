    function authenticate() {
      const pw = document.getElementById('loginPassword').value;
      if (pw === PASSWORD) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        localStorage.setItem('ccAuth', 'true');
        // Set today's date
        document.getElementById('contactDate').value = new Date().toISOString().split('T')[0];
        initCollegeSearch();
        loadRecentContacts();
      } else {
        document.getElementById('loginError').textContent = 'Invalid password';
      }
    }

    const teamMap = {
      '2027 Olasin': 'olasin_roster.html', '2027 McCoy': 'mccoy_roster.html',
      '2027 Menendez': 'menendez_roster.html', '2027 Thomas': 'thomas_roster.html',
      '2028 Lawson': 'scout_lawson_roster.html', '2028 DiBenedetto': 'scout_dibenedetto_roster.html',

      '2029 Cates': 'cates_roster.html', '2030 Madsen': 'madsen_roster.html',

    async function loadPlayers() {
      const team = document.getElementById('teamSelect').value;
      const playerSelect = document.getElementById('playerSelect');
      const evaluatorSelect = document.getElementById('evaluatorSelect');
      playerSelect.innerHTML = '<option value="">Select Player</option>';
      evaluatorSelect.innerHTML = '<option value="">Select Evaluator</option>';
      if (!team) return;

      // Populate evaluators
      (evaluatorsByTeam[team] || []).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        evaluatorSelect.appendChild(opt);
      });
      if (playersByTeam[team]) {
        populatePlayers(team); return;
      }
      const file = teamMap[team];
      const response = await fetch(file);
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const rows = doc.querySelectorAll('.roster-table tbody tr');
      const players = [];
      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length >= 3) {
          const jersey = parseInt(cells[0]?.textContent.trim()) || 0;
          const firstName = cells[1]?.textContent.trim();
          const lastName = cells[2]?.textContent.trim();
          if (firstName && lastName) players.push({ jersey, firstName, lastName });
        }
      });
      players.sort((a, b) => a.jersey - b.jersey);
      playersByTeam[team] = players;
      populatePlayers(team);
    }

    function populatePlayers(team) {
      const playerSelect = document.getElementById('playerSelect');
      playerSelect.innerHTML = '<option value="">Select Player</option>';
      (playersByTeam[team] || []).forEach(p => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify(p);
        opt.textContent = `#${p.jersey} — ${p.firstName} ${p.lastName}`;
        playerSelect.appendChild(opt);
      });
    }

    function initCollegeSearch() {
      const input = document.getElementById('collegeSearch');
      const dropdown = document.getElementById('collegeDropdown');

      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if (q.length < 1) { dropdown.style.display = 'none'; return; }
        const matches = COLLEGE_LIST.filter(c => c.name.toLowerCase().includes(q) || (c.alias && c.alias.toLowerCase().includes(q))).slice(0, 15);
        if (!matches.length) { dropdown.style.display = 'none'; return; }
        dropdown.innerHTML = '';
        matches.forEach(c => {
          const item = document.createElement('div');
          item.style.cssText = 'padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#0d1a33;border-bottom:1px solid #f0f0f0;';
          item.innerHTML = `<span style="display:flex;flex-direction:column;gap:1px;"><span>${c.name}</span>${c.conf ? `<span style="font-size:10px;color:#888;">${c.conf}</span>` : ''}</span><span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#b91e2d;color:#fff;white-space:nowrap;flex-shrink:0;">${c.div}</span>`;
          item.addEventListener('mouseenter', () => item.style.background = '#f8f0f0');
          item.addEventListener('mouseleave', () => item.style.background = '');
          item.addEventListener('click', () => selectCollege(c.name, c.div, c.conf));
          dropdown.appendChild(item);
        });
        dropdown.style.display = 'block';
      });

      input.addEventListener('blur', () => setTimeout(() => { dropdown.style.display = 'none'; }, 150));
    }

    function selectCollege(name, div, conf) {
      if (!selectedColleges.find(c => c.name === name)) {
        selectedColleges.push({ name, div, conf: conf || '' });
        renderChips();
      }
      document.getElementById('collegeSearch').value = '';
      document.getElementById('collegeDropdown').style.display = 'none';
    }

    function renderChips() {
      const container = document.getElementById('collegeChips');
      container.innerHTML = '';
      selectedColleges.forEach((c, i) => {
        const chip = document.createElement('div');
        chip.className = 'college-chip';
        chip.innerHTML = `<span class="badge">${c.div}</span><span style="color:#0d1a33;display:flex;flex-direction:column;gap:1px;"><span>${c.name}</span>${c.conf ? `<span style="font-size:10px;color:#888;">${c.conf}</span>` : ''}</span><span class="chip-x" data-i="${i}">✕</span>`;
        chip.querySelector('.chip-x').addEventListener('click', () => {
          selectedColleges.splice(i, 1);
          renderChips();
        });
        container.appendChild(chip);
      });
    }

    async function submitContacts() {
      const team = document.getElementById('teamSelect').value;
      const playerRaw = document.getElementById('playerSelect').value;
      const loggedBy = document.getElementById('evaluatorSelect').value;
      const date = document.getElementById('contactDate').value;

      if (!team || !playerRaw || !loggedBy || selectedColleges.length === 0 || !date) {
        document.getElementById('errorMsg').textContent = 'Please fill in all fields and add at least one college.';
        document.getElementById('errorMsg').style.display = 'block';
        setTimeout(() => document.getElementById('errorMsg').style.display = 'none', 3000);
        return;
      }

      const player = JSON.parse(playerRaw);
      const rows = selectedColleges.map(c => ({
        team_name: team,
        player_first_name: player.firstName,
        player_last_name: player.lastName,
        college_name: c.name,
        division: c.div,
        contact_date: date,
        logged_by: loggedBy
      }));

      const { error } = await db.from('college_contacts').insert(rows);
      if (error) {
        document.getElementById('errorMsg').textContent = 'Error: ' + error.message;
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      document.getElementById('successMsg').style.display = 'block';
      setTimeout(() => document.getElementById('successMsg').style.display = 'none', 3000);
      selectedColleges = [];
      renderChips();
      document.getElementById('playerSelect').value = '';
      document.getElementById('evaluatorSelect').value = '';
      document.getElementById('collegeSearch').value = '';
      loadRecentContacts();
    }

    async function loadRecentContacts() {
      const { data, error } = await db.from('college_contacts')
        .select('*').order('created_at', { ascending: false }).limit(10);
      const container = document.getElementById('recentLog');
      if (error || !data?.length) {
        container.innerHTML = '<p style="color:rgba(255,255,255,0.4);font-size:13px;">No contacts logged yet.</p>';
        return;
      }
      container.innerHTML = data.map(r => `
        <div class="log-item">
          <div>
            <div class="log-player">${r.player_first_name} ${r.player_last_name} <span style="color:rgba(255,255,255,0.4);font-weight:400;font-size:12px;">${r.team_name}</span></div>
            <div class="log-college">
              <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:#b91e2d;color:#fff;margin-right:6px;">${r.division}</span>
              ${r.college_name}
            </div>
            ${r.logged_by ? `<div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:3px;">Logged by ${r.logged_by}</div>` : ''}
          </div>
          <div class="log-date">${new Date(r.contact_date).toLocaleDateString()}</div>
        </div>
      `).join('');
    }

    window.addEventListener('load', () => {
      if (localStorage.getItem('ccAuth') === 'true') {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        document.getElementById('contactDate').value = new Date().toISOString().split('T')[0];
        initCollegeSearch();
        loadRecentContacts();
      }
      document.getElementById('loginPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') authenticate();
      });
    });
