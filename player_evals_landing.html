<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Evaluations - Landing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 500px; width: 100%; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .card h1 { font-size: 28px; margin-bottom: 0.5rem; color: #1a1a1a; }
    .card p { color: #999; font-size: 14px; margin-bottom: 2rem; line-height: 1.6; }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      padding: 1rem;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-block;
    }
    .btn-primary {
      background: #c41e3a;
      color: white;
    }
    .btn-primary:hover { background: #a01628; }
    .btn-secondary {
      background: #f0f0f0;
      color: #1a1a1a;
      border: 0.5px solid #ddd;
    }
    .btn-secondary:hover { background: #e0e0e0; }
    .divider {
      margin: 2rem 0;
      height: 0.5px;
      background: #e0e0e0;
    }
    .back-link {
      font-size: 14px;
      color: #999;
      text-decoration: none;
      margin-top: 1.5rem;
      display: inline-block;
    }
    .back-link:hover { color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Player Evaluations</h1>
      <p>Submit new player evaluations or view existing ones</p>
      
      <div class="buttons">
        <a href="player_evals.html" class="btn btn-primary">Submit Player Evaluation</a>
        <a href="view_player_evals.html" class="btn btn-secondary">View Evaluations</a>
      </div>
      
      <div class="divider"></div>
      
      <a href="evals_landing.html" class="back-link">← Back to Evaluations</a>
    </div>
  </div>
</body>
</html>
